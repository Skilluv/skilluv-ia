# Dependabot config — Skilluv AI microservice (Python + uv).
# Note : Dependabot for pip parses `pyproject.toml` deps and `uv.lock` only if
# `pip-tools`-compatible. `uv` support is beta — expect some noise; adjust
# `open-pull-requests-limit` if PRs get overwhelming.

version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels: [dependencies, python]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, github-actions]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, docker]
