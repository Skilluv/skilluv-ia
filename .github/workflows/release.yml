name: Release image

# Build + push l'image Docker sur GHCR lors du push d'un tag `mvp-*` ou `v*`.
# Le tag Git devient le tag Docker → docker-compose.prod.yml peut le référencer
# via `SKILLUV_AI_IMAGE_TAG=mvp-1` (voir docs/DEPLOYMENT-HETZNER.md §5).

on:
  push:
    tags:
      - 'mvp-*'
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag Docker à publier (ex: mvp-1-hotfix)'
        required: true
        default: 'manual-run'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build multi-arch + push GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # L'image embarque torch + sentence-transformers + tree-sitter-* + ffmpeg.
      # Le runner default (~14 GB) ne suffit pas avec la layer cache Docker.
      # On libère ~30 GB avant de commencer.
      - name: Free disk space on runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false     # on garde les images déjà pull (buildx)
          swap-storage: true

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/mvp-') || startsWith(github.ref, 'refs/tags/v') }}

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 seulement pour l'instant (Hetzner CX22 = x86_64).
          # arm64 activable si besoin future : platforms: linux/amd64,linux/arm64
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.tags && github.event.head_commit.timestamp || '' }}
          # cache-to mode=min évite d'exporter toutes les layers intermédiaires
          # (qui contiennent torch, transformers, etc. et remplissent le cache
          # GHA en heures). mode=min = seulement le layer final.
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Summary
        run: |
          echo "### Image publiée" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tags :" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Déploiement prod : suivre docs/DEPLOYMENT-HETZNER.md §5-6." >> $GITHUB_STEP_SUMMARY
