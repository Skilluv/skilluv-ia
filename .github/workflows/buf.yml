name: Proto (buf lint + breaking)

# IA-01 — buf breaking detects a contract-breaking proto change against master;
# buf lint (advisory) reports style. Matches the repo's tag-pinned actions.
on:
  pull_request:
    branches: [master]
    paths: ["proto/**", "buf.yaml", ".github/workflows/buf.yml"]
  push:
    branches: [master]
    paths: ["proto/**", "buf.yaml"]

permissions:
  contents: read

jobs:
  buf:
    name: buf lint + breaking
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # buf breaking reads the master branch from local git
      - uses: bufbuild/buf-setup-action@v1
      - name: Lint (advisory)
        continue-on-error: true
        run: buf lint
      - name: Breaking against master
        run: buf breaking --against '.git#branch=master'
