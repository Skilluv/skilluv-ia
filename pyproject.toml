[project]
name = "skilluv-ai"
version = "0.1.0"
description = "Service IA pour Skilluv — génération de challenges, détection de plagiat, matching talent, traitement média"
requires-python = ">=3.12"
dependencies = [
    # API & gRPC
    "fastapi>=0.139",
    "uvicorn[standard]>=0.51",
    "grpcio>=1.68",
    "grpcio-tools>=1.68",
    "grpcio-health-checking>=1.68",
    # Workers async
    "arq>=0.28",
    # LLM
    "anthropic>=0.117,<1",
    # Plagiat — AST
    "tree-sitter>=0.26",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-go>=0.23",
    # Plagiat — Embeddings
    "sentence-transformers>=5.0",
    # Média
    "ffmpeg-python>=0.2",
    "Pillow>=12.0",
    # Stockage
    "minio>=7.2",
    # Config & validation
    "pydantic>=2.13",
    "pydantic-settings>=2.7",
    # Redis
    "redis[hiredis]>=5.2",
    # Monitoring
    "prometheus-client>=0.25",
    # Logging
    "structlog>=25.0",
    "grpcio-reflection>=1.81.1",
    "jsonschema>=4.26.0",
    "torch>=2.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    # Rerun automatique des tests marqués `@pytest.mark.flaky` — utilisé pour
    # les tests d'intégration LLM local qui sont probabilistes par nature.
    "pytest-rerunfailures>=15.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "fakeredis>=2.26",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    # Tests d'intégration qui parlent à un vrai serveur Ollama local sur
    # $OLLAMA_ENDPOINT (défaut http://localhost:11434). Skippés automatiquement
    # si Ollama n'est pas joignable. Lents (10s-2min par test selon modèle).
    # Run : `uv run pytest -m local_llm` (ou `RUN_LOCAL_LLM=1 uv run pytest`).
    "local_llm: tests d'intégration contre un vrai serveur Ollama local",
    # Tests d'intégration nécessitant Redis / MinIO (docker compose up -d).
    "integration: tests d'intégration nécessitant des services externes",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]

[tool.ruff.lint.per-file-ignores]
# gRPC servicers doivent matcher les method names PascalCase du .proto —
# renaming en snake_case briserait le contrat gRPC.
"src/grpc_server/*_servicer.py" = ["N802"]
# Les prompts LLM sont des chaînes multilignes intentionnellement longues
# (lisibilité côté lecture > wrapping arbitraire). Ne pas casser au milieu
# d'une phrase de prompt.
"src/services/_challenge_prompts.py" = ["E501"]
"src/services/_talent_prompts.py" = ["E501"]
"src/services/_analytics_prompts.py" = ["E501"]
# Champs Pydantic avec description longue (une ligne = un champ, plus lisible).
"src/models/challenge.py" = ["E501"]
"src/models/queue_messages.py" = ["E501"]
"src/models/job_results.py" = ["E501"]
# Tests : longueur de ligne moins strict, assertRaises(Exception) accepté
# pour tester des erreurs non-typées, et zip() sans strict acceptable.
"tests/**/*.py" = ["E501", "B017", "B905", "N806"]

[tool.mypy]
python_version = "3.12"
strict = true
